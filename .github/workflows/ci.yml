name: CI
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Criar .env para o CI
        run: cp .env.example .env

      - name: Validar o compose
        run: docker compose config

      # RESOLVIDO: O nome do serviço configurado no compose.yaml é 'app'
      - name: Build da imagem
        run: docker compose build app

      - name: Subir a stack
        run: docker compose up -d

      - name: Aguardar a aplicação responder
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/items > /dev/null; then
              echo "Aplicacao no ar!"
              exit 0
            fi
            echo "tentativa $i..."
            sleep 3
          done
          echo "A aplicacao nao subiu a tempo"
          docker compose logs
          exit 1

      # Executa o smoke test do CRUD criando e listando uma tarefa via API
      - name: Smoke test do CRUD
        run: |
          curl -sf -X POST http://localhost:3000/items \
            -H 'Content-Type: application/json' \
            -d '{"id":"ci-test-1","name":"tarefa criada pelo CI","completed":false}'
          echo ""
          curl -sf http://localhost:3000/items | tee resposta.json

      # Passo extra de boa prática para não deixar recursos travados no runner
      - name: Derrubar a stack
        run: docker compose down -v
