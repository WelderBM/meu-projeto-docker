services:
  db:
    image: mysql:8.0
    container_name: todo-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - todo-mysql-data:/var/lib/mysql
    networks:
      - todo-net
    # Requisito obrigatório: healthcheck para garantir que o banco está pronto
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-app-compose
    ports:
      - "3000:3000"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DATABASE}
    networks:
      - todo-net
    # Requisito obrigatório: impede o app de iniciar antes do healthcheck do db dar 'healthy'
    depends_on:
      db:
        condition: service_healthy

# Requisitos obrigatórios: volumes e redes explicitamente nomeados
volumes:
  todo-mysql-data:
    name: todo-mysql-data

networks:
  todo-net:
    name: todo-net
